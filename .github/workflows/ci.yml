name: CI

on:
  push:
  pull_request:

jobs:
  linux-tests:
    name: Linux tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,xlsx]"
      - name: Run tests
        run: python -m pytest -q

  windows-tests:
    name: Windows tests (Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,xlsx]"
      - name: Run tests
        run: python -m pytest -q

  ruff:
    name: Ruff (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,xlsx]"
      - name: Run Ruff
        run: python -m ruff check src tests

  build:
    name: Build and inspect metadata (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,xlsx]"
      - name: Build package
        run: python -m build
      - name: Inspect wheel metadata
        shell: python {0}
        run: |
          import ast
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile
          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet

          source = ast.parse(Path("src/sec2md/__init__.py").read_text(encoding="utf-8"))
          version = next(ast.literal_eval(node.value) for node in source.body
                         if isinstance(node, ast.Assign)
                         and any(isinstance(target, ast.Name) and target.id == "__version__"
                                 for target in node.targets))
          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith("/METADATA"))
              metadata = Parser().parsestr(archive.read(metadata_name).decode("utf-8"))
          assert metadata["Version"] == version
          assert SpecifierSet(metadata["Requires-Python"]) == SpecifierSet(">=3.10,<3.13")
          assert "Repository, https://github.com/kelab5am/sec2md" in metadata.get_all("Project-URL")
          assert "xlsx" in metadata.get_all("Provides-Extra")
          requirement, = [Requirement(value) for value in metadata.get_all("Requires-Dist")
                          if Requirement(value).name == "openpyxl"]
          assert requirement.specifier == SpecifierSet(">=3.1.5,<4")
          assert requirement.marker.evaluate({"extra": "xlsx"})
          assert not requirement.marker.evaluate({"extra": ""})
      - name: Clean minimal wheel install and Markdown smoke (without openpyxl)
        run: |
          python -m venv .minimal
          .minimal/bin/python -m pip install dist/*.whl
          .minimal/bin/python -I -c "import importlib.util; assert importlib.util.find_spec('openpyxl') is None; import sec2md; assert 'Revenue' in sec2md.convert_to_markdown('<html><body><p>Revenue is reported here.</p></body></html>'); assert importlib.util.find_spec('openpyxl') is None"
