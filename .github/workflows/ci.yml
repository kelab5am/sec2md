name: CI

on:
  push:
  pull_request:

jobs:
  linux-tests:
    name: Linux tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  windows-tests:
    name: Windows tests (Python 3.12)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  ruff:
    name: Ruff (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Ruff
        run: python -m ruff check src tests

  build:
    name: Build and inspect metadata (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build package
        run: python -m build
      - name: Inspect wheel metadata
        shell: python {0}
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith("METADATA"))
              metadata = archive.read(metadata_name).decode("utf-8")
          assert "Version: 0.1.22+rcq.1" in metadata
          assert "Requires-Python: <3.13,>=3.10" in metadata
          assert "Project-URL: Repository, https://github.com/kelab5am/sec2md" in metadata
